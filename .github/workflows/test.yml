name: Automated Testing

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore Dependencies
      run: dotnet restore

    - name: Build Project
      run: dotnet build --no-restore

    - name: Run Tests
      run: dotnet test "C:\Users\patri\OneDrive\Desktop\3rd Year Projects\prog7311-poe-part3-ST10440987-Patrick-master\prog7311-poe-part3-ST10440987-Patrick-master\PROG7311_UnitTesting\PROG7311_Testing.csproj" --no-build --verbosity normal
