version: '3.9'

services:
  frontend:
    build:
      context: ./PROG7311_PoE
    container_name: frontend
    ports:
      - "5000:8081"
    depends_on:
      - backend

  backend:
    build:
      context: ./TechMove.Backend_API
    container_name: backend
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=TechMoveDb;User Id=sa;Password=Your_password123;TrustServerCertificate=True;
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "5001:8080"
    depends_on:
      - sqlserver
    
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      SA_PASSWORD: "Your_password123"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sqlvolume:/var/opt/mssql

volumes:
  sqlvolume: